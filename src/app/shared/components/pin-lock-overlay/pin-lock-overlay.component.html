<div class="pin-lock" role="dialog" aria-modal="true" aria-label="Unos PIN-a">
  <form class="pin-lock__card" [formGroup]="form" (ngSubmit)="submit()">
    <header>
      <span class="pin-lock__icon"><i class="pi pi-lock"></i></span>
      <div><small>ZAŠTIĆENI PRISTUP</small><h2>Zaslon je zaključan</h2></div>
    </header>

    <div class="pin-lock__users">
      @for (user of users(); track user.email) {
        <button type="button" [class.pin-lock__user--selected]="selected() === user" (click)="select(user)">
          <span [style.background]="user.colorHex || 'var(--teal)'">{{ initials(user) }}</span>
          <strong>{{ user.firstName }} {{ user.lastName.charAt(0) }}.</strong>
        </button>
      }
    </div>

    @if (selected(); as user) {
      <label for="lock-pin">Upiši PIN za {{ user.firstName }}</label>
      <input id="lock-pin" pInputText type="password" formControlName="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" autofocus />
    }
    @if (failed()) { <p class="pin-lock__error">PIN nije ispravan. Pokušajte ponovno.</p> }
    <p class="pin-lock__hint">Podaci ostaju otvoreni u pozadini — smjena se ne prekida.</p>
    <footer><button type="button" (click)="useOtherAccount()">Prijavi se drugim računom</button><p-button type="submit" label="Otključaj" [loading]="loading()" /></footer>
  </form>
</div>
