<div class="shell">
  <aside class="shell__sidebar" [class.shell__sidebar--open]="sidebarOpen()">
    <app-sidebar (navigated)="closeSidebar()" />
  </aside>

  @if (sidebarOpen()) {
    <div class="shell__scrim" (click)="closeSidebar()"></div>
  }

  <div class="shell__main">
    <app-topbar [titleKey]="pageTitleKey()" (menuToggle)="toggleSidebar()" />
    <main class="shell__content">
      @if (!locked()) {
        <app-set-pin-cta />
        <router-outlet />
      }
    </main>
  </div>

  @if (locked()) {
    <app-pin-lock-overlay />
  }
</div>
<!-- Only authenticated (shell) pages ask for confirmation; keeping it here keeps
     Dialog/Button/FocusTrap out of the initial bundle. -->
<p-confirmdialog />
