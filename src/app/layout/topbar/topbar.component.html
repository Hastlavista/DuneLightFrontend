<header class="topbar">
  <button
    type="button"
    class="topbar__menu-btn"
    (click)="menuToggle.emit()"
    [attr.aria-label]="'LAYOUT.TOPBAR.OPEN_MENU' | translate">
    <i class="pi pi-bars"></i>
  </button>

  <h1 class="topbar__title">{{ (titleKey() ?? '') | translate }}</h1>

  <div class="topbar__actions">
    @if (isAdmin()) {
      <div class="topbar__view-switch">
        <a routerLink="/admin" routerLinkActive="topbar__view-switch-btn--active" class="topbar__view-switch-btn">
          {{ 'LAYOUT.TOPBAR.VIEW_ADMIN' | translate }}
        </a>
        <a routerLink="/app" routerLinkActive="topbar__view-switch-btn--active" class="topbar__view-switch-btn">
          {{ 'LAYOUT.TOPBAR.VIEW_MEMBER' | translate }}
        </a>
      </div>
    }

    <p-select
      [options]="locationOptions()"
      optionLabel="label"
      optionValue="value"
      [ngModel]="selectedLocationId()"
      (ngModelChange)="onLocationChange($event)"
      [ariaLabel]="'LAYOUT.TOPBAR.LOCATION_SWITCHER' | translate"
      styleClass="topbar__location-select"
    />
  </div>
</header>
