<div class="sidebar" [class.sidebar--admin]="section() === 'admin'">
  <div class="sidebar__brand">
    @if (logoUrl(); as url) {
      <img class="sidebar__brand-logo" [src]="url" alt="Organization logo" />
    } @else {
      <span class="sidebar__brand-mark">DL</span>
      <span class="sidebar__brand-name">DuneLight</span>
    }
  </div>

  <nav class="sidebar__nav">
    @for (group of navGroups(); track group.labelKey ?? $index) {
      <div class="sidebar__nav-group">
        @if (group.labelKey) {
          <span class="sidebar__nav-group-label">{{ group.labelKey | translate }}</span>
        }
        @for (item of group.items; track item.path) {
          <a
            class="sidebar__nav-item"
            [routerLink]="[basePath(), item.path]"
            routerLinkActive="sidebar__nav-item--active"
            (click)="onNavigate()"
          >
            <i class="pi" [class]="item.icon"></i>
            <span>{{ item.labelKey | translate }}</span>
          </a>
        }
      </div>
    }
  </nav>
</div>
