<div class="birthdays-page">
  <div class="birthdays-page__toolbar">
    <div class="birthdays-page__quick-ranges">
      <p-button [text]="activeRange() !== 'today'" [label]="'CLIENTS.BIRTHDAYS.RANGE_TODAY' | translate" (onClick)="applyQuickRange('today')" />
      <p-button [text]="activeRange() !== 'week'" [label]="'CLIENTS.BIRTHDAYS.RANGE_WEEK' | translate" (onClick)="applyQuickRange('week')" />
      <p-button [text]="activeRange() !== 'month'" [label]="'CLIENTS.BIRTHDAYS.RANGE_MONTH' | translate" (onClick)="applyQuickRange('month')" />
    </div>
    <span class="birthdays-page__range-label">{{ rangeLabel() }}</span>
  </div>

  @if (loading()) {
    <div class="birthdays-page__empty">Učitavanje...</div>
  } @else if (items().length) {
    <div class="birthdays-page__list">
      @for (item of items(); track item.id) {
        <button type="button" class="birthdays-page__row" (click)="openClient(item)">
          <span class="birthdays-page__avatar">{{ initials(item) }}</span>
          <span class="birthdays-page__person"><strong>{{ item.firstName }} {{ item.lastName }}</strong><small>{{ item.phone || '—' }}</small></span>
          <span class="birthdays-page__when">{{ whenLabel(item) }}</span>
          <strong class="birthdays-page__age">{{ turningAge(item) }}</strong>
        </button>
      }
    </div>
  } @else {
    <div class="birthdays-page__empty">{{ 'CLIENTS.BIRTHDAYS.EMPTY' | translate }}</div>
  }
</div>
