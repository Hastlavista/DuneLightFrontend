<div class="client-tags-page">
  <header class="client-tags-page__header">
    <p>{{ totalCount() }} oznaka · {{ activeCount() }} aktivnih</p>
    <p-button icon="pi pi-plus" [label]="'CLIENTS.TAGS.NEW' | translate" (onClick)="openCreate()" />
  </header>

  @if (loading()) {
    <div class="client-tags-page__empty">Učitavanje...</div>
  } @else if (items().length) {
    <div class="client-tags-page__grid">
      @for (tag of items(); track tag.id) {
        <article class="client-tags-page__card" [class.client-tags-page__card--inactive]="!tag.isActive" [style.border-left-color]="tag.colorHex || 'var(--brand-primary)'">
          <div class="client-tags-page__content">
            <div><h3>{{ tag.name }}</h3><app-status-tag [active]="tag.isActive" /></div>
            <span>Redoslijed {{ tag.sortOrder }}</span>
          </div>
          <div class="client-tags-page__actions">
          <p-button
            icon="pi pi-pencil"
            [text]="true"
            [rounded]="true"
            [ariaLabel]="'COMMON.EDIT' | translate"
            [title]="'COMMON.EDIT' | translate"
            (onClick)="openEdit(tag)"
          />
          @if (tag.isActive) {
            <p-button
              icon="pi pi-eye-slash"
              severity="warn"
              [text]="true"
              [rounded]="true"
              [ariaLabel]="'COMMON.DEACTIVATE' | translate"
              [title]="'COMMON.DEACTIVATE' | translate"
              (onClick)="confirmDeactivate(tag)"
            />
          } @else {
            <p-button
              icon="pi pi-eye"
              severity="success"
              [text]="true"
              [rounded]="true"
              [ariaLabel]="'COMMON.ACTIVATE' | translate"
              [title]="'COMMON.ACTIVATE' | translate"
              (onClick)="activate(tag)"
            />
          }
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            [ariaLabel]="'COMMON.DELETE' | translate"
            [title]="'COMMON.DELETE' | translate"
            (onClick)="confirmDelete(tag)"
          />
          </div>
        </article>
      }
    </div>
  } @else {
    <div class="client-tags-page__empty">{{ 'CLIENTS.TAGS.EMPTY' | translate }}</div>
  }
</div>

<app-client-tag-form-dialog [(visible)]="dialogVisible" [tag]="editingTag()" (saved)="onSaved()" />
