<div class="shifts-page">
  <app-complete-employee-profile-cta />

  <p-tabs [value]="initialTab" [lazy]="true" styleClass="shifts-page__tabs">
    <p-tablist>
      <p-tab value="types">
        <span>{{ 'ROSTER.TYPES.TAB_LABEL' | translate }}</span>
      </p-tab>
      <p-tab value="team">
        <span>{{ 'ROSTER.TEAM_MONTHLY.TAB_LABEL' | translate }}</span>
      </p-tab>
      @if (hasEmployeeProfile()) {
        <p-tab value="personal">
          <span>{{ 'ROSTER.PERSONAL.TAB_LABEL' | translate }}</span>
        </p-tab>
      }
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="types">
        <ng-template #content><app-admin-roster-types /></ng-template>
      </p-tabpanel>
      <p-tabpanel value="team">
        <ng-template #content>
          <app-roster-team-monthly
            [currentEmployeeId]="currentEmployeeId()"
            [activeCompanies]="activeCompanies()"
            (cellClick)="onTeamCellClick($event)"
          />
        </ng-template>
      </p-tabpanel>
      @if (hasEmployeeProfile()) {
        <p-tabpanel value="personal">
          <ng-template #content>
            <app-roster-personal
              [allowEmployeePicker]="true"
              [currentEmployeeId]="currentEmployeeId()"
              [employees]="activeEmployees()"
              (add)="onPersonalAdd($event)"
              (edit)="onPersonalEdit($event)"
            />
          </ng-template>
        </p-tabpanel>
      }
    </p-tabpanels>
  </p-tabs>
</div>

<app-roster-entry-form-dialog
  [(visible)]="dialogVisible"
  [entry]="editingEntry()"
  [initial]="dialogInitial()"
  [employees]="activeEmployees()"
  [rosterTypes]="activeRosterTypes()"
  [currentEmployeeId]="currentEmployeeId()"
  (saved)="onDialogSaved()"
/>
