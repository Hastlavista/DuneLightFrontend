<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '26rem' }"
  [header]="'EMPLOYEES.CHANGE_ROLE_TITLE' | translate"
  (onShow)="onDialogShow()"
>
  @if (dialogShown() && employee(); as employee) {
  <form [formGroup]="form" (ngSubmit)="onSave()" class="dl-form" novalidate>
    <p class="dl-form__hint">
      {{ 'EMPLOYEES.CHANGE_ROLE_HINT' | translate: { name: employee.firstName + ' ' + employee.lastName } }}
    </p>

    <div class="dl-form__field">
      <label for="role-change-role">{{ 'EMPLOYEES.FIELD_ROLE' | translate }}</label>
      <p-select
        id="role-change-role"
        fluid
        appendTo="body"
        formControlName="role"
        [options]="roleOptions()"
        optionLabel="label"
        optionValue="value"
      />
    </div>

    <div class="dl-form__actions">
      <p-button
        type="button"
        [text]="true"
        severity="secondary"
        [label]="'COMMON.CANCEL' | translate"
        (onClick)="onCancel()"
      />
      <p-button type="submit" [label]="'COMMON.SAVE' | translate" [loading]="saving()" />
    </div>
  </form>
  }
</p-dialog>
