<p-tabs [value]="initialTab" [lazy]="true">
  <p-tablist>
    <p-tab value="products">{{ 'CATALOG.PRODUCTS_TAB_LABEL' | translate }}</p-tab>
    <p-tab value="stock">{{ 'CATALOG.STOCK_TAB_LABEL' | translate }}</p-tab>
  </p-tablist>
  <p-tabpanels>
    <p-tabpanel value="products">
      <ng-template #content><app-admin-catalog-products (changed)="onProductsChanged()" /></ng-template>
    </p-tabpanel>
    <p-tabpanel value="stock">
      <ng-template #content><app-admin-stock /></ng-template>
    </p-tabpanel>
  </p-tabpanels>
</p-tabs>
