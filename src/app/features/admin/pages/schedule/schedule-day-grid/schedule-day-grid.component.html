<div class="schedule-day-grid">
  <div class="schedule-day-grid__nav">
    <p-button icon="pi pi-chevron-left" [text]="true" [ariaLabel]="'SCHEDULE.PREV_DAY' | translate" (onClick)="goPrevDay()" />
    <p-datepicker appendTo="body" dateFormat="dd.mm.yy" [ngModel]="selectedDate()" (ngModelChange)="onDateChange($event)" />
    <p-button icon="pi pi-chevron-right" [text]="true" [ariaLabel]="'SCHEDULE.NEXT_DAY' | translate" (onClick)="goNextDay()" />
    <p-button [label]="'SCHEDULE.TODAY' | translate" [text]="true" (onClick)="goToday()" />
  </div>

  @if (columns().length === 0) {
    <div class="schedule-day-grid__empty">{{ 'SCHEDULE.NO_TRAINERS' | translate }}</div>
  } @else {
    <app-schedule-grid
      [columns]="columns()"
      [cells]="gridCells()"
      [columnWidthPx]="columnWidthPx"
      (cellClick)="onCellClick($event)"
      (emptySlotClick)="onEmptySlotClick($event)"
    />
  }
</div>
