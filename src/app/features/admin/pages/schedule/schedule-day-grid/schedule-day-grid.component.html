<div class="schedule-day-grid">
  <div class="schedule-day-grid__nav">
    <p-button styleClass="schedule-day-grid__nav-button" icon="pi pi-chevron-left" [outlined]="true" [ariaLabel]="'SCHEDULE.PREV_DAY' | translate" (onClick)="goPrevDay()" />
    <span class="schedule-day-grid__date-title">{{ selectedDateLabel() }}</span>
    <p-button styleClass="schedule-day-grid__nav-button" icon="pi pi-chevron-right" [outlined]="true" [ariaLabel]="'SCHEDULE.NEXT_DAY' | translate" (onClick)="goNextDay()" />
    <p-datepicker styleClass="schedule-day-grid__date-picker" appendTo="body" dateFormat="dd.mm.yy" [ngModel]="selectedDate()" (ngModelChange)="onDateChange($event)" />
    <p-button styleClass="schedule-day-grid__today-button" [label]="'SCHEDULE.TODAY' | translate" [text]="true" (onClick)="goToday()" />
  </div>

  @if (todayHolidayName(); as holidayName) {
    <div class="schedule-day-grid__holiday-banner">
      <i class="pi pi-info-circle"></i>
      {{ 'SCHEDULE.HOLIDAY_BANNER' | translate: { name: holidayName } }}
    </div>
  }

  @if (columns().length === 0) {
    <div class="schedule-day-grid__empty">{{ 'SCHEDULE.NO_TRAINERS' | translate }}</div>
  } @else {
    <app-schedule-grid
      [columns]="columns()"
      [cells]="gridCells()"
      [columnWidthPx]="columnWidthPx"
      (cellClick)="onCellClick($event)"
      (emptySlotClick)="onEmptySlotClick($event)"
    />
  }
</div>
