<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '28rem' }"
  [header]="(isEditMode() ? 'PERMISSIONS.ROLES.EDIT_TITLE' : 'PERMISSIONS.ROLES.NEW_TITLE') | translate"
  (onShow)="onDialogShow()"
>
  @if (dialogShown()) {
  <form [formGroup]="form" (ngSubmit)="onSave()" class="dl-form" novalidate>
    <div class="dl-form__field">
      <label for="role-name">{{ 'PERMISSIONS.ROLES.FIELD_NAME' | translate }}</label>
      <input id="role-name" type="text" pInputText fluid formControlName="name" maxlength="255" />
      @if (form.controls.name.invalid && form.controls.name.touched) {
        <span class="dl-form__error">{{ 'PERMISSIONS.ROLES.ERRORS.NAME_REQUIRED' | translate }}</span>
      }
    </div>

    <div class="dl-form__actions">
      <p-button
        type="button"
        [text]="true"
        severity="secondary"
        [label]="'COMMON.CANCEL' | translate"
        (onClick)="onCancel()"
      />
      <p-button type="submit" [label]="'COMMON.SAVE' | translate" [loading]="saving()" />
    </div>
  </form>
  }
</p-dialog>
